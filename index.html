<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKU MIKU BEAM!</title>
    <style>
        body {
            background-color: #39C5BB; /* Miku's signature teal */
            color: white;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
            overflow-x: hidden;
        }

        /* Fullscreen Start Overlay to allow audio */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: #ffff00;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 9999;
            cursor: pointer;
            text-shadow: 0 0 10px #ff007f;
        }

        h1 {
            font-size: 5rem;
            text-shadow: 4px 4px #ff007f;
            animation: shake 0.5s infinite;
            margin-bottom: 0;
        }

        .beam {
            font-size: 4rem;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073;
            animation: pulse 0.5s infinite alternate;
            margin: 20px 0;
        }

        .silly-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 8px dashed #ff007f;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        .marquee-text {
            font-size: 2.5rem;
            background-color: #111;
            color: #39C5BB;
            padding: 15px;
            margin-top: 40px;
            border-top: 5px solid white;
            border-bottom: 5px solid white;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <!-- CLICK OVERLAY TO UNLOCK AUDIO -->
